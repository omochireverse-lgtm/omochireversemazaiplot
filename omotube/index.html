<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omotube｜おもちかえして</title>
<style>
  :root{
    --bg:#ffffff; --surface:#f4f3f0; --text:#1d1c1a; --sub:#65635e; --muted:#99968f;
    --line:#e6e4df; --accent:#d9542b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141413; --surface:#22211f; --text:#efede8; --sub:#b3b0aa; --muted:#86837d;
      --line:#34332f; --accent:#ef7a52; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
  header{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:5}
  .logo{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
  .logo [data-omo-logo]{display:flex}
  .logo svg{width:44px;height:44px;transition:transform .2s}
  .logo:hover svg{transform:scale(1.08,.92)}
  .logo .word{font-weight:800;font-size:21px;letter-spacing:-.6px;line-height:1}
  .logo .word em{font-style:normal;color:var(--word)}
  @media (prefers-color-scheme: dark){ .logo .word em{color:var(--word-dark)} }
  .logo small{display:block;font-size:10px;font-weight:500;color:var(--sub);letter-spacing:.5px;margin-top:2px}

  main{max-width:1200px;margin:0 auto;padding:24px 16px 64px}
  .intro{margin:0 0 24px}
  .intro h1{font-size:22px;margin:0 0 4px}
  .intro p{margin:0;color:var(--sub);font-size:14px}

  .grid{display:grid;gap:28px 16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{text-decoration:none;color:var(--text);display:block}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
  .card:hover .thumb img{transform:scale(1.04)}
  .badge{position:absolute;left:8px;top:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;
    border-radius:6px;padding:1px 7px}
  .info{display:flex;gap:10px;margin-top:10px}
  .ch{flex:none;width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;overflow:hidden}
  .ch svg{width:30px;height:30px}
  .t{font-size:15px;font-weight:700;line-height:1.4;margin:0}
  .s{font-size:13px;color:var(--sub);margin:2px 0 0}
  .n{font-size:13px;color:var(--muted);margin:2px 0 0}
</style>
</head>
<body>
<header>
  <a class="logo" href="./" aria-label="Omotube トップ">
    <span data-omo-logo></span>
    <span><span class="word"><em>Omo</em>tube</span><small>おもちかえして</small></span>
  </a>
</header>

<main>
  <section class="intro">
    <h1>おもちかえしてのネタ</h1>
    <p>見たいネタを選んでください。笑ったところで「笑った」ボタンを押してもらえると、ネタ作りの参考になります。</p>
  </section>
  <div class="grid" id="grid"></div>
</main>

<script src="omotube.js"></script>
<script>
omoMountLogo();
const grid = document.getElementById("grid");
const countEls = {};

OMOTUBE.VIDEOS.forEach((v, i) => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = "watch.html?v=" + encodeURIComponent(v.id);

  const th = document.createElement("div"); th.className = "thumb";
  const img = document.createElement("img"); img.src = omoThumb(v.id); img.alt = ""; img.loading = "lazy";
  th.appendChild(img);
  if (i === 0){ const b = document.createElement("span"); b.className = "badge"; b.textContent = "最新"; th.appendChild(b); }

  const info = document.createElement("div"); info.className = "info";
  const ch = document.createElement("div"); ch.className = "ch"; ch.innerHTML = omoLogoSVG(OMOTUBE.LOGO);
  const box = document.createElement("div");
  const t = document.createElement("p"); t.className = "t"; t.textContent = v.title || "おもちかえして";
  const s = document.createElement("p"); s.className = "s"; s.textContent = v.note || "おもちかえして";
  const n = document.createElement("p"); n.className = "n"; n.textContent = "";
  countEls[v.id] = n;
  box.append(t, s, n); info.append(ch, box);
  a.append(th, info);
  grid.appendChild(a);

  // タイトル未入力ならYouTubeから取ってくる
  if (!v.title){
    fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + v.id))
      .then(r => r.json()).then(d => { if (d.title) t.textContent = d.title; }).catch(() => {});
  }
});

if (OMOTUBE.API_URL){
  fetch(OMOTUBE.API_URL + "?counts=1")
    .then(r => r.json())
    .then(d => {
      const c = d.counts || {};
      Object.keys(countEls).forEach(id => { countEls[id].textContent = "コメント " + (c[id] || 0) + " 件"; });
    })
    .catch(() => {});
}
</script>
</body>
</html>
