<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おもちかえして</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F4;
    --bg-warm:#F1E6DC;
    --ink:#1A1917;
    --ink-soft:#6B675E;
    --line:#E3D2CE;
    --wine:#6E2A34;
    --wine-soft:#8C4753;
    --wine-dark:#3F1820;
    --cream:#F3E7D6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(110,42,52,0.10), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    font-weight:300;
    line-height:1.9;
    letter-spacing:.02em;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}

  /* header */
  header{
    padding:30px 0 26px;text-align:center;
    background:
      radial-gradient(ellipse 700px 380px at 50% 0%, rgba(255,255,255,0.05), transparent 65%),
      linear-gradient(175deg, var(--wine-dark), var(--wine) 130%);
  }
  .logo-mark{
    width:44px;height:44px;margin:0 auto 14px;
    background:var(--cream);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.22);
  }
  .logo-mark img{width:60%;display:block;mix-blend-mode:multiply;}

  .eyebrow{
    font-family:'Noto Sans JP',sans-serif;font-size:10px;letter-spacing:.28em;
    color:rgba(243,231,214,0.68);text-transform:uppercase;margin-bottom:8px;
  }
  header h1{
    font-family:'Shippori Mincho',serif;font-weight:600;
    font-size:clamp(21px,4.2vw,27px);letter-spacing:.12em;
    color:var(--cream);margin-bottom:8px;
  }
  header p.sub{color:rgba(243,231,214,0.62);font-size:11.5px;font-weight:300;letter-spacing:.05em;}

  .taglist{
    display:flex;justify-content:center;gap:0;margin-top:14px;
    font-size:11px;color:rgba(243,231,214,0.62);letter-spacing:.04em;
  }
  .taglist span{padding:0 14px;}
  .taglist span:first-child{border-right:1px solid rgba(243,231,214,0.25);}

  .sns-links{display:flex;justify-content:center;gap:14px;margin-top:16px;}
  .sns-links a{
    width:30px;height:30px;border-radius:50%;
    border:1px solid rgba(243,231,214,0.35);
    display:flex;align-items:center;justify-content:center;
    transition:all .3s;
  }
  .sns-links a:hover{border-color:var(--cream);background:rgba(243,231,214,0.08);}
  .sns-links svg{width:16px;height:16px;}

  .hairline{
    width:1px;height:26px;background:var(--line);margin:0 auto;
  }

  /* section titles */
  .section{padding:36px 0;}
  .section-head{margin-bottom:24px;}
  .section-eyebrow{
    font-size:11px;letter-spacing:.28em;color:var(--wine);
    text-transform:uppercase;margin-bottom:10px;text-align:center;
    position:relative;padding-bottom:14px;
  }
  .section-eyebrow::after{
    content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:28px;height:2px;background:var(--wine);opacity:.55;
  }
  .section-title{
    font-family:'Shippori Mincho',serif;font-weight:600;font-size:23px;
    letter-spacing:.08em;text-align:center;margin-bottom:12px;
  }
  .section-sub{
    color:var(--ink-soft);font-size:13px;text-align:center;font-weight:300;
  }

  /* video list */
  .video-list{display:flex;flex-direction:column;gap:56px;}
  .video-item{}
  .video-frame{
    position:relative;width:100%;aspect-ratio:16/9;background:#111;
    border:1px solid var(--line);
    box-shadow:0 14px 30px rgba(110,42,52,0.08);
    transition:all .45s cubic-bezier(.22,.9,.35,1);
  }
  .video-frame iframe{
    position:absolute;top:0;left:0;width:100%;height:100%;border:0;
  }

  .mini-close{
    display:none;
    position:absolute;top:-11px;right:-11px;width:26px;height:26px;
    border-radius:50%;border:1px solid var(--ink);background:var(--cream);
    color:var(--ink);font-size:14px;line-height:1;cursor:pointer;
    align-items:center;justify-content:center;z-index:2;
  }

  .video-placeholder{
    display:none;
    align-items:center;justify-content:space-between;
    background:var(--bg-warm);border:1px dashed var(--line);
    padding:14px 16px;font-size:12px;color:var(--ink-soft);
  }
  .video-placeholder button{
    font-family:'Noto Sans JP',sans-serif;font-size:11px;color:var(--wine);
    background:none;border:1px solid var(--wine);border-radius:20px;
    padding:5px 12px;cursor:pointer;white-space:nowrap;margin-left:12px;
  }

  /* mini / floating state */
  .video-item.is-mini .video-frame{
    position:fixed;
    bottom:20px;right:20px;
    width:240px;aspect-ratio:16/9;
    z-index:999;
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
    border-radius:4px;overflow:hidden;
  }
  .video-item.is-mini .mini-close{display:flex;}
  .video-item.is-mini .video-placeholder{display:flex;}
  .video-item.is-mini .video-caption{display:none;}

  @media (max-width:600px){
    .video-item.is-mini .video-frame{
      width:44vw;right:12px;bottom:12px;
    }
  }

  .video-caption{
    display:flex;justify-content:space-between;align-items:baseline;
    padding-top:16px;border-top:1px solid var(--line);margin-top:16px;
  }
  .video-caption h3{
    font-family:'Shippori Mincho',serif;font-weight:600;font-size:17px;
    letter-spacing:.06em;
  }
  .video-caption .v{
    font-size:11px;color:var(--ink-soft);letter-spacing:.1em;
  }

  /* feedback */
  .feedback-frame{
    border:1px solid var(--line);background:#FFFEFB;
    box-shadow:0 14px 30px rgba(110,42,52,0.08);
  }
  .feedback-frame iframe{width:100%;border:0;display:block;}

  footer{
    text-align:center;padding:60px 0 80px;color:var(--ink-soft);font-size:11px;
    letter-spacing:.08em;
    border-top:1px solid var(--line);
    margin-top:20px;
  }
  footer .wrap{padding-top:40px;}

  @media (min-width:640px){
    header{padding:40px 0 32px;}
  }
</style>
</head>
